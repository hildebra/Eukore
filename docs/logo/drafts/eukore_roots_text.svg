<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 436" width="600" height="436" role="img" aria-labelledby="t">
  <title id="t">Eukore</title>
  <defs>
    <linearGradient id="db" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16324F"/>
      <stop offset="0.55" stop-color="#1D5C73"/>
      <stop offset="1" stop-color="#16324F"/>
    </linearGradient>
    <linearGradient id="dbtop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FB6B2"/>
      <stop offset="1" stop-color="#1E8C8E"/>
    </linearGradient>
  </defs>

  <!-- the phylogeny, growing out of the database: (plants, (Amoebozoa, (Fungi, (mouse, human)))) -->
  <g fill="none" stroke="#1F2A44" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80,86 V176 H355 V154"/>
    <path d="M190,86 V154 H410 V132"/>
    <path d="M300,86 V132 H465 V110"/>
    <path d="M410,86 V110 H520 V86"/>
  </g>
  <g fill="#1F2A44">
    <circle cx="355" cy="154" r="6"/>
    <circle cx="410" cy="132" r="6"/>
    <circle cx="465" cy="110" r="6"/>
  </g>

  <!-- the database, the tree's root -->
  <path d="M240,214 V280 A60,17 0 0 0 360,280 V214 Z" fill="url(#db)"/>
  <path d="M240,236 A60,17 0 0 0 360,236" fill="none" stroke="#7FD3CF" stroke-width="2.5" opacity="0.75"/>
  <path d="M240,258 A60,17 0 0 0 360,258" fill="none" stroke="#7FD3CF" stroke-width="2.5" opacity="0.75"/>
  <ellipse cx="300" cy="214" rx="60" ry="17" fill="url(#dbtop)"/>
  <path d="M300,176 V214" fill="none" stroke="#1F2A44" stroke-width="5" stroke-linecap="round"/>
  <circle cx="300" cy="176" r="6" fill="#1F2A44"/>
  <circle cx="300" cy="214" r="6" fill="#1F2A44"/>

  <!-- the tips -->
  <!-- tree (plants) -->
  <g transform="translate(80,50)">
    <circle r="36" fill="#E6F4EA" stroke="#2E8B57" stroke-width="3"/>
    <g fill="#2E8B57">
      <rect x="-3.5" y="2" width="7" height="20" rx="2"/>
      <circle cx="0" cy="-11" r="12"/>
      <circle cx="-10" cy="-3" r="9"/>
      <circle cx="10" cy="-3" r="9"/>
      <circle cx="0" cy="-1" r="9"/>
    </g>
  </g>
  <!-- amoeba (Amoebozoa) -->
  <g transform="translate(190,50)">
    <circle r="36" fill="#F1EAF8" stroke="#7B4FA0" stroke-width="3"/>
    <path d="M-20,-2 C-25,-14 -11,-23 -2,-16 C4,-25 19,-20 16,-8 C27,-6 26,9 14,10 C14,23 -2,24 -6,14 C-17,20 -27,10 -20,-2 Z" fill="#7B4FA0"/>
    <circle cx="2" cy="-2" r="5.5" fill="#F1EAF8"/>
    <circle cx="-10" cy="6" r="2.5" fill="#F1EAF8"/>
    <circle cx="10" cy="5" r="2" fill="#F1EAF8"/>
  </g>
  <!-- yeast (Fungi), budding -->
  <g transform="translate(300,50)">
    <circle r="36" fill="#FCF0DF" stroke="#C07A1E" stroke-width="3"/>
    <ellipse cx="-4" cy="4" rx="16" ry="14" fill="#C07A1E"/>
    <circle cx="13" cy="-12" r="8.5" fill="#C07A1E" stroke="#FCF0DF" stroke-width="2.5"/>
    <circle cx="-6" cy="5" r="5" fill="#FCF0DF"/>
  </g>
  <!-- mouse -->
  <g transform="translate(410,50)">
    <circle r="36" fill="#E6EEF8" stroke="#3D6FA8" stroke-width="3"/>
    <g fill="#3D6FA8">
      <ellipse cx="-4" cy="6" rx="15" ry="10"/>
      <path d="M3,-3 C11,-10 20,-6 26,3 C22,9 14,11 5,11 Z"/>
      <circle cx="8" cy="-8" r="6"/>
    </g>
    <circle cx="8" cy="-8" r="2.8" fill="#E6EEF8"/>
    <circle cx="17" cy="1" r="1.8" fill="#E6EEF8"/>
    <path d="M-18,9 C-27,13 -30,2 -24,-4" fill="none" stroke="#3D6FA8" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- human -->
  <g transform="translate(520,50)">
    <circle r="36" fill="#E6EEF8" stroke="#3D6FA8" stroke-width="3"/>
    <g fill="#3D6FA8">
      <circle cx="0" cy="-12" r="8"/>
      <path d="M-14,21 V7 C-14,-1 -8,-2 0,-2 C8,-2 14,-1 14,7 V21 Z"/>
    </g>
  </g>

  <!-- the name -->
  <text x="300" y="380" text-anchor="middle" font-family="Montserrat, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="76" font-weight="700" letter-spacing="2" fill="#1F2A44">Euk<tspan fill="#1E8C8E">ore</tspan></text>
  <text x="300" y="416" text-anchor="middle" font-family="Montserrat, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="15" font-weight="600" letter-spacing="4.5" fill="#5B6478">EUKARYOTE MARKER GENES</text>
</svg>
