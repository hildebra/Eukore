# The benchmarks' environment (since 2026-11-12): only what the comparisons, the read benchmark and the figures run;
# the databases they compare with are downloads in BENCH (eukore-bench-prep.sh), not packages here. The scripts make
# it at BENCH/env, its package cache at BENCH/pkgs (bench_env.sh): nothing in a home folder's conda directories.
name: eukore-bench
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.12
  - numpy                # the database's code the benchmarks read the package with (eukore/rrna.py)
  - matplotlib-base      # eukore_bench/figures.py
  - minimap2             # the read benchmark's aligner (eukore_bench/reads.py)
  - curl                 # the downloads (eukore/util.py fetch_file; Python's urllib where absent)
  - isa-l                # igzip: the downloads' gzip checks, ~3.5x Python's
