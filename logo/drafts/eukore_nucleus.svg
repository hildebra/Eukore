<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" role="img" aria-labelledby="t">
  <title id="t">Eukore</title>
  <defs>
    <linearGradient id="db" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16324F"/>
      <stop offset="0.55" stop-color="#1D5C73"/>
      <stop offset="1" stop-color="#16324F"/>
    </linearGradient>
  </defs>

  <!-- the cell -->
  <path d="M300,62 C400,58 492,120 498,214 C504,300 446,392 340,400 C240,408 120,380 104,282 C90,190 180,66 300,62 Z"
        fill="#EEF7F6" stroke="#1F2A44" stroke-width="6" stroke-linejoin="round"/>

  <!-- the nucleus: a double envelope with pores, the database inside -->
  <circle cx="285" cy="226" r="90" fill="#D4EFEC"/>
  <circle cx="285" cy="226" r="90" fill="none" stroke="#1E8C8E" stroke-width="5" stroke-dasharray="44 9" stroke-linecap="round"/>
  <circle cx="285" cy="226" r="80" fill="none" stroke="#1E8C8E" stroke-width="3" stroke-dasharray="39 8" stroke-linecap="round"/>
  <g>
    <path d="M245,193 V251 A40,11 0 0 0 325,251 V193 Z" fill="url(#db)"/>
    <path d="M245,212 A40,11 0 0 0 325,212" fill="none" stroke="#7FD3CF" stroke-width="2.5" opacity="0.8"/>
    <path d="M245,231 A40,11 0 0 0 325,231" fill="none" stroke="#7FD3CF" stroke-width="2.5" opacity="0.8"/>
    <ellipse cx="285" cy="193" rx="40" ry="11" fill="#3FB6B2"/>
  </g>

  <!-- a mitochondrion (its rRNA and COX1) -->
  <g transform="translate(188,336) rotate(18)">
    <rect x="-40" y="-17" width="80" height="34" rx="17" fill="#FBE6D8" stroke="#C0603A" stroke-width="4"/>
    <path d="M-28,8 L-20,-8 L-12,8 L-4,-8 L4,8 L12,-8 L20,8 L28,-6" fill="none" stroke="#C0603A" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- a plastid (its rRNA) -->
  <g transform="translate(418,148) rotate(28)">
    <ellipse rx="40" ry="21" fill="#DFF2E4" stroke="#2E8B57" stroke-width="4"/>
    <g fill="#2E8B57">
      <rect x="-24" y="-9" width="10" height="18" rx="3"/>
      <rect x="-5" y="-11" width="10" height="22" rx="3"/>
      <rect x="14" y="-9" width="10" height="18" rx="3"/>
    </g>
  </g>

  <!-- vesicles -->
  <g fill="#9CC9DB">
    <circle cx="405" cy="258" r="8"/>
    <circle cx="438" cy="292" r="5"/>
    <circle cx="368" cy="352" r="7"/>
    <circle cx="168" cy="190" r="6"/>
  </g>

  <!-- the name -->
  <text x="300" y="492" text-anchor="middle" font-family="Montserrat, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="76" font-weight="700" letter-spacing="2" fill="#1F2A44">Euk<tspan fill="#1E8C8E">ore</tspan></text>
  <text x="300" y="530" text-anchor="middle" font-family="Montserrat, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="15" font-weight="600" letter-spacing="4.5" fill="#5B6478">EUKARYOTE MARKER GENES</text>
</svg>
