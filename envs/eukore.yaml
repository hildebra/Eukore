# Eukore's build environment (micromamba create -f envs/eukore.yaml; then micromamba activate eukore).
# tiara (optional: the windows around the copies classified) needs a Python of 3.9 or older: envs/tiara.yaml, given
# to the build with --tiara <that env>/bin/tiara.
name: eukore
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.12
  - zstd                 # zstd files where the Python is older than 3.14
  - miniprot>=0.18       # the euk30 loci placed (eukore/loci.py: --trans)
  - hmmer>=3.4           # hmmsearch: the loci confirmed by BUSCO's HMMs; nhmmer: the assemblies' organelle genes
  - barrnap              # the genomes' and published reads' rRNA genes
  - itsx                 # ITS1/5.8S/ITS2/28S borders (the build refuses an incomplete ITSx_db)
  - vsearch              # the checks across species and the part screen
  - minimap2             # the read benchmark's aligner (eukore/reads.py)
  - isa-l                # igzip: the downloads' gzip checks, ~3.5x Python's (eukore/util.py)
  - p7zip                # EUKARYOME's 7z archive
  - openpyxl             # EUKARYOME's compromised-quality ids (xlsx)
  - ncbi-fcs-gx          # optional: FCS-GX (run_gx) with --fcs_gx_db, on a node of ~512 GB
  - matplotlib-base      # docs/benchmarks/plot_benchmarks.py: the benchmarks' figures
